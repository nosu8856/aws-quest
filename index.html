function levelMax(){return 70+S.level*45}function maxHp(){return 100+(S.level-1)*12}function atk(){return 12+S.level*3+(ITEMS.find(i=>i.id===S.weapon)?.atk||0)}function defense(){return 2+Math.floor(S.level/2)+(ITEMS.find(i=>i.id===S.armor)?.def||0)}
function xpGain(x){S.xp+=x;let ups=0;while(S.xp>=levelMax()){S.xp-=levelMax();S.level++;ups++;S.hp=maxHp()}if(ups){pop('✨ LEVEL UP! Lv.'+S.level);audio('win')}save()}
function track(q,ok){let h=S.history[q.id]||{right:0,wrong:0,last:0,next:0};h[ok?'right':'wrong']++;h.last=Date.now();h.next=Date.now()+(ok?Math.min(7,1+h.right)*864e5:8*36e5);S.history[q.id]=h;S.answersToday++;S.seen=[q.id,...S.seen.filter(x=>x!==q.id)].slice(0,28);save()}
function pick(pool){let sorted=[...pool].sort((a,b)=>{let ha=S.history[a.id]||{},hb=S.history[b.id]||{};const score=x=>{let h=S.history[x.id]||{};return (h.wrong||0)*2-(h.right||0)*.25+(h.next&&h.next<Date.now()?4:0)+(S.seen.slice(0,7).includes(x.id)?-12:0)+((x.tag==='Spot'||x.tag==='Auto Scaling'||x.d===1)&&!h.last?3:0)+Math.random()*5};return score(b)-score(a)});return sorted[0]||QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)]}
function shuffledQ(q){let opts=q.opts.map((t,i)=>({t,i}));for(let i=opts.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}return {...q,order:opts,correctPositions:opts.map((x,i)=>q.correct.includes(x.i)?i:-1).filter(x=>x>=0)}}
function navHtml(){return `<nav class="nav">${[['home','🏕️','拠点'],['map','🗺️','冒険'],['review','📖','復習'],['shop','⚔️','装備'],['exam','📝','模試']].map(([v,i,t])=>`<button class="${view===v?'sel':''}" onclick="go('${v}')"><span class="ic">${i}</span>${t}</button>`).join('')}</nav>`}
function frame(content){$('#app').innerHTML=`<header class="header"><div><div class="logo">AWS QUEST</div><h1>クラウドの覇者</h1></div><div style="text-align:right"><div class="gold">🪙 ${S.gold} G</div><div class="tiny muted">Lv.${S.level} ${esc(S.name)}</div></div></header><main class="wrap">${content}</main>${navHtml()}<div class="footer">AWSサービスの魔法表現は学習上の比喩です。実際のサービス動作とは異なります。<br>非公式の学習ゲーム / ローカル端末内に自動保存</div>`}
function go(v){if(battle&&v!=='battle'){battle=null}if(exam&&v!=='examplay'&&v!=='examresult'){if(!confirm('模擬試験を中断しますか？'))return;exam=null;clearInterval(mockTimer)}view=v;render();scrollTo(0,0)}
function render(){if(view==='home')home();else if(view==='map')map();else if(view==='battle')battleUI();else if(view==='result')winUI();else if(view==='review')review();else if(view==='shop')shop();else if(view==='exam')examHome();else if(view==='examplay')examUI();else if(view==='examresult')examResult();}
function home(){let progress=S.completed.length,accuracy=stats(QUESTIONS).accuracy;frame(`<div class="hero"><span class="spark a">✧</span><span class="spark b">✦</span><span class="spark c">✧</span><div class="avatar">${S.level>=15?'🧙':S.level>=7?'🥷':'🧝'}</div><div class="level">${esc(S.name)} · Lv.${S.level} / ${progress}/16 STAGES</div></div><section class="panel"><div class="rowline"><b>クラウド騎士の記録</b><button class="btn alt" style="padding:8px;min-height:32px" onclick="rename()">名前変更</button></div><div class="progress"><span>EXP ${S.xp}/${levelMax()}</span><span>次のレベルまで ${levelMax()-S.xp}</span></div><div class="bar"><i style="width:${100*S.xp/levelMax()}%"></i></div><div class="progress"><span>HP ${S.hp}/${maxHp()}</span><span>攻撃 ${atk()} / 防御 ${defense()}</span></div><div class="bar hp"><i style="width:${100*S.hp/maxHp()}%"></i></div><div class="stats" style="margin-top:14px"><div class="stat">🔥<br><b>${S.streak}日</b><div class="tiny muted">連続ログイン</div></div><div class="stat">🎯<br><b>${accuracy}%</b><div class="tiny muted">正答率</div></div><div class="stat">📚<br><b>${S.answersToday}/10</b><div class="tiny muted">今日の目標</div></div></div></section><button class="btn wide" onclick="go('map')">⚔️ 冒険に出発する</button><div class="panel" style="margin-top:14px"><h2>📜 今日の使命</h2><div class="small muted">10問に挑戦して学習習慣を育てよう</div><div class="meter"><i style="width:${Math.min(100,S.answersToday*10)}%"></i></div><div class="rowline"><span class="small">達成度 ${Math.min(S.answersToday,10)}/10</span><span class="gold small">${S.answersToday>=10?'✨ 達成！':'あと'+Math.max(0,10-S.answersToday)+'問'}</span></div><div class="btnrow"><button class="btn alt" onclick="go('review')">📖 弱点を復習</button><button class="btn alt" onclick="toggleSound()">${S.sound?'🔊':'🔇'} 効果音</button></div></div><div class="panel"><h2>🕰️ 冒険の足跡</h2><p class="small muted">回答数 ${Object.values(S.history).reduce((n,h)=>n+h.right+h.wrong,0)}問 / 勝利 ${S.sessions}回 / 学習時間 約${Math.floor(S.studySeconds/60)}分</p><div class="tiny muted" style="margin-top:8px">最初に重点復習：セキュリティ・スポット・Auto Scaling</div></div>`)}
function rename(){let n=prompt('冒険者の名前を入力（12文字以内）',S.name);if(n!==null){S.name=n.trim().slice(0,12)||'冒険者';save();render()}}
function toggleSound(){S.sound=!S.sound;save();render()}
function map(){frame(`<h2 class="screen-title">🗺️ クラウディア世界地図</h2><p class="small muted" style="margin-bottom:14px">各章の試練を突破し、最後のボスを討伐して次の地域を解放。</p><div class="map">${REGIONS.map((r,d)=>{let unlocked=d===0||S.completed.includes((d-1)*4+3),count=S.completed.filter(x=>Math.floor(x/4)===d).length;return `<div class="region ${unlocked?'':'locked'}"><div class="rowline"><div><div class="tiny gold">第${d+1}章 · ${r.title}</div><h2 style="font-size:19px;margin:5px 0">${r.icon} ${r.name}</h2></div><b>${unlocked?count+'/4':'🔒'}</b></div><div class="small muted">${r.desc}</div><div class="nodes">${r.monsters.map((m,i)=>{let id=d*4+i,done=S.completed.includes(id),can=unlocked&&(i===0||S.completed.includes(id-1));return `<button class="node ${done?'done':''} ${i===3?'boss':''}" ${can?'':'disabled'} onclick="startBattle(${d},${i})"><span>${!can?'🔒':done?'✅':m}</span>${i===3?'BOSS':i===2?'中ボス':'試練'+(i+1)}</button>`}).join('')}</div></div>`}).join('')}</div>`)}
function startBattle(d,i,mode='story'){if(S.hp<=0)S.hp=Math.ceil(maxHp()/2);let boss=i===3,mini=i===2;let difficulty=1+d*0.32+(boss?.4:mini?.2:0);battle={d,i,mode,boss,enemy:REGIONS[d].monsters[i],name:boss?REGIONS[d].boss:mini?'上級守護者':'霧の魔獣',max:Math.round((boss?115:mini?85:62)*difficulty),hp:0,combo:0,correct:0,total:0,selected:[],answered:false,start:Date.now(),q:null,used:[],result:null};battle.hp=battle.max;view='battle';nextQuestion();render()}
function nextQuestion(){if(!battle)return;let pool=QUESTIONS.filter(q=>q.d===battle.d&&!battle.used.includes(q.id));if(battle.mode==='review'){let wrong=QUESTIONS.filter(q=>(S.history[q.id]?.wrong||0)>0&&!battle.used.includes(q.id));pool=wrong.length?wrong:QUESTIONS.filter(q=>!battle.used.includes(q.id))}if(!pool.length){battle.used=[];pool=QUESTIONS.filter(q=>q.d===battle.d)}let q=pick(pool);battle.used.push(q.id);battle.q=shuffledQ(q);battle.selected=[];battle.answered=false;battle.start=Date.now()}
function battleUI(){let b=battle;if(!b)return go('map');let q=b.q,ratio=Math.max(0,100*b.hp/b.max),pr=Math.max(0,100*S.hp/maxHp());frame(`<div class="rowline"><button class="btn alt" style="padding:9px;min-height:38px" onclick="exitBattle()">← 撤退</button><span class="pill">${b.mode==='review'?'復習戦':`第${b.d+1}章 ${b.boss?'BOSS':'STAGE '+(b.i+1)}`}</span><span class="pill">🔥 ${b.combo} COMBO</span></div><div class="progress"><span>敵: ${b.name}</span><span>${Math.max(0,b.hp)}/${b.max} HP</span></div><div class="bar hp"><i style="width:${ratio}%"></i></div><div class="battlefield"><div class="fighter">${S.level>=7?'🥷':'🧝'}</div><div class="enemy" id="enemy">${b.enemy}</div><div id="damage"></div></div><div class="progress"><span>冒険者 ${S.name}</span><span>HP ${S.hp}/${maxHp()}</span></div><div class="bar hp"><i style="width:${pr}%"></i></div><section class="panel" style="margin-top:14px"><div class="rowline"><span class="pill">${['クラウド','セキュリティ','サービス','料金'][q.d]}</span><span class="tiny muted">${q.correct.length===2?'2つ選択':'1つ選択'} · ${q.tag}</span></div><h2 style="font-size:16px;line-height:1.55;margin:12px 0">${esc(q.q)}</h2>${q.order.map((o,n)=>`<button class="choice ${b.selected.includes(n)?'selected':''} ${b.answered?(q.correctPositions.includes(n)?'correct':b.selected.includes(n)?'wrong':''):''}" ${b.answered?'disabled':''} onclick="choose(${n})"><b style="color:#d2b987">${'ABCD'[n]}.</b> ${esc(o.t)}</button>`).join('')}${b.answered?`<div class="notice"><b>${b.result.ok?'✅ 正解！':'❌ 不正解'} ${b.result.msg}</b><div class="answer-ex">${esc(q.ex)}<br><b>正解：</b>${q.correctPositions.map(n=>esc(q.order[n].t)).join(' / ')}<br><b>不正解の理由：</b>${q.order.filter(o=>!q.correct.includes(o.i)).map(o=>esc(o.t)+'は、この問いに必要な「'+esc(q.opts[q.correct[0]])+'」の機能・条件を満たさない。').join(' ')}</div></div><button class="btn wide" onclick="advance()">${b.hp<=0?'戦利品を受け取る':S.hp<=0?'拠点へ戻る':'次の一撃へ →'}</button>`:q.correct.length>1?`<button class="btn wide" ${b.selected.length!==q.correct.length?'disabled':''} onclick="submitAnswer()">この${q.correct.length}つで回答</button>`:''}</section>`)}
function choose(n){let b=battle;if(!b||b.answered)return;let need=b.q.correct.length;if(need===1){b.selected=[n];submitAnswer();return}if(b.selected.includes(n))b.selected=b.selected.filter(x=>x!==n);else if(b.selected.length<need)b.selected.push(n);battleUI()}
function submitAnswer(){let b=battle;if(!b||b.answered||b.selected.length!==b.q.correct.length)return;let ok=b.selected.every(n=>b.q.correctPositions.includes(n));b.answered=true;b.total++;track(b.q,ok);let elapsed=(Date.now()-b.start)/1000;if(ok){b.combo++;b.correct++;let damage=atk()+Math.min(20,b.combo*3)+(elapsed<8?Math.round(atk()*.55):0);b.hp=Math.max(0,b.hp-damage);b.result={ok:true,msg:`${damage}ダメージ！${elapsed<8?' ⚡クリティカル':''}`};audio('hit')}else{b.combo=0;let dmg=Math.max(4,Math.round((13+b.d*6+(b.boss?7:0))-defense()));S.hp=Math.max(0,S.hp-dmg);b.result={ok:false,msg:`敵の反撃 −${dmg}HP`};audio('bad')}S.studySeconds+=Math.max(3,Math.min(120,Math.round(elapsed)));save();battleUI();let en=$('#enemy');if(en){en.classList.add(ok?'hit':'attack');setTimeout(()=>en.classList.remove('hit','attack'),400)}let dd=$('#damage');if(dd)dd.innerHTML=`<div class="damage">${ok?'-'+(b.max-b.hp):'MISS'}</div>`}
function advance(){let b=battle;if(!b||!b.answered)return;if(b.hp<=0){finishBattle();return}if(S.hp<=0){pop('💔 戦闘不能… 拠点で回復');battle=null;go('home');return}nextQuestion();battleUI()}
function exitBattle(){if(confirm('戦闘を中断しますか？ それまでの回答履歴は保存されます。')){battle=null;go('map')}}
function finishBattle(){let b=battle,bid=b.d*4+b.i,first=!S.completed.includes(bid);if(first&&b.mode==='story')S.completed.push(bid);let xp=(b.boss?95:50)+b.d*14, gold=(b.boss?70:32)+b.d*12;S.gold+=gold;S.sessions++;if(b.boss)S.logs.unshift({day:today(),name:b.name});S.logs=S.logs.slice(0,20);xpGain(xp);S.hp=Math.min(maxHp(),S.hp+Math.round(maxHp()*.3));save();battle={...b,rewards:{xp,gold,first}};view='result';render();audio('win')}
function winUI(){let b=battle;if(!b)return go('map');frame(`<div class="panel" style="text-align:center;margin-top:20px"><div class="gold tiny">QUEST CLEAR</div><h2 style="font-size:30px;margin:12px">${b.boss?'🏆 魔王軍を撃破！':'⚔️ 勝利！'}</h2><div class="reward">🎁</div><div class="small muted">${esc(b.name)} を討伐した！</div><div class="stats" style="margin:20px 0"><div class="stat">✨<br><b>+${b.rewards.xp}</b><div class="tiny">EXP</div></div><div class="stat">🪙<br><b>+${b.rewards.gold}</b><div class="tiny">GOLD</div></div><div class="stat">🎯<br><b>${b.correct}/${b.total}</b><div class="tiny">正解</div></div></div>${b.boss?'<div class="notice">🔓 次の章が解放されました（最終章は全クリア！）</div>':''}<button class="btn wide" onclick="battle=null;go('map')">ワールドマップへ →</button></div>`)}
function stats(pool){let n=0,r=0;pool.forEach(q=>{let h=S.history[q.id];if(h){n+=h.right+h.wrong;r+=h.right}});return {n,r,accuracy:n?Math.round(100*r/n):0}}
function review(){let wrong=QUESTIONS.filter(q=>S.history[q.id]?.wrong>0).sort((a,b)=>(S.history[b.id].wrong-S.history[a.id].wrong)),due=wrong.filter(q=>(S.history[q.id].next||0)<=Date.now());frame(`<h2 class="screen-title">📖 復習の書</h2><div class="panel"><h2>知識は、敗北から鍛えられる</h2><div class="stats"><div class="stat">🩹<br><b>${wrong.length}</b><div class="tiny">間違えた問題</div></div><div class="stat">⏳<br><b>${due.length}</b><div class="tiny">復習の時期</div></div><div class="stat">📚<br><b>${stats(QUESTIONS).accuracy}%</b><div class="tiny">正答率</div></div></div><button class="btn wide" style="margin-top:14px" onclick="startReview()">⚔️ ${wrong.length?'弱点':'総合'}復習バトル</button></div><div class="panel"><h2>分野別の成績</h2>${REGIONS.map((r,d)=>{let s=stats(QUESTIONS.filter(q=>q.d===d));return `<div class="rowline small"><span>${r.icon} ${r.name}</span><b>${s.accuracy}% <span class="muted">(${s.n}問)</span></b></div><div class="meter"><i style="width:${s.accuracy}%"></i></div>`}).join('')}</div><div class="panel"><h2>苦手なサービス</h2>${[...new Set(wrong.map(q=>q.tag))].map(tag=>({tag,n:wrong.filter(q=>q.tag===tag).reduce((v,q)=>v+S.history[q.id].wrong,0)})).sort((a,b)=>b.n-a.n).slice(0,8).map(x=>`<div class="rowline small"><span>${esc(x.tag)}</span><span class="gold">${x.n}回ミス</span></div>`).join('')||'<div class="small muted">まだ間違いの記録はありません。</div>'}</div><div class="panel"><h2>間違えた問題</h2>${wrong.slice(0,20).map(q=>`<div class="item"><div class="small">${esc(q.q)}</div><div class="tiny muted">${q.tag} · ${S.history[q.id].wrong}回ミス / ${S.history[q.id].right}回正解</div><div class="tiny gold">答え：${q.correct.map(i=>q.opts[i]).join(' / ')}</div></div>`).join('')||'<div class="small muted">冒険の中で出会った問題が記録されます。</div>'}</div>`)}
function startReview(){startBattle(1,1,'review');battle.enemy='📕';battle.name='記憶の番人';battle.max=95;battle.hp=95;render()}
function shop(){frame(`<h2 class="screen-title">⚔️ 鍛冶屋と装備</h2><div class="panel"><div class="rowline"><b>🪙 所持金 ${S.gold} G</b><span class="pill">攻撃 ${atk()} / 防御 ${defense()}</span></div><div class="small muted">装備は攻撃力・防御力を上げる。回復薬でHPを回復しよう。</div></div>${ITEMS.map(it=>{let owned=S.owned.includes(it.id),equipped=S.weapon===it.id||S.armor===it.id;return `<div class="item"><div class="rowline"><div><div class="card-title">${it.icon} ${it.name}</div><div class="small muted">${it.heal?'HP +'+it.heal:it.atk?'攻撃 +'+it.atk:'防御 +'+it.def} · ${it.cost}G</div></div><button class="btn ${equipped?'alt':''}" style="padding:10px;min-height:42px" onclick="buy('${it.id}')">${it.heal?'使用 / 購入':equipped?'装備中':owned?'装備':'購入'}</button></div></div>`}).join('')}<div class="panel"><div class="small muted">🧪 回復薬の所持数: ${S.potions}個</div><button class="btn alt wide" onclick="usePotion()" style="margin-top:8px">回復薬を使う</button></div>`)}
function buy(id){let it=ITEMS.find(x=>x.id===id);if(!it)return;if(it.heal){if(S.gold<it.cost){pop('ゴールド不足');return}S.gold-=it.cost;S.potions++;pop('回復薬を入手！')}else{if(!S.owned.includes(id)){if(S.gold<it.cost){pop('ゴールド不足');return}S.gold-=it.cost;S.owned.push(id);pop('✨ 新しい装備を獲得！')}if(it.atk)S.weapon=id;else S.armor=id}save();render()}
function usePotion(){if(S.potions<1){pop('回復薬がない');return}if(S.hp>=maxHp()){pop('HPは満タン');return}S.potions--;S.hp=Math.min(maxHp(),S.hp+35);save();pop('❤️ HP +35');render()}
function examHome(){frame(`<h2 class="screen-title">📝 CLF-C02 模擬試験</h2><div class="panel"><h2>最後の試練 · 65問</h2><p class="small muted" style="line-height:1.8">65問 / 制限90分。単一選択と複数選択が混在します。解説は終了後にまとめて表示します。<br>問題の配分は公式ガイドの出題分野比率に近づけています。</p><div class="notice">公式試験の合格ラインは換算スコア700/1000。ゲームの正答率は公式換算スコアを再現しません。</div><button class="btn wide" onclick="startExam()">模擬試験を開始する</button></div><div class="panel"><h2>出題範囲</h2>${['クラウドのコンセプト 24%','セキュリティとコンプライアンス 30%','クラウドテクノロジーとサービス 34%','請求、料金、サポート 12%'].map(x=>`<div class="item small">${x}</div>`).join('')}</div>`)}
function startExam(){let counts=[14,17,22,12],qs=[];for(let d=0;d<4;d++){let a=QUESTIONS.filter(q=>q.d===d).sort(()=>Math.random()-.5);for(let i=0;i<counts[d];i++)qs.push(shuffledQ(a[i%a.length]))}for(let i=qs.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]]}exam={qs,index:0,answers:{},ends:Date.now()+90*60000,submitted:false};view='examplay';mockTimer=setInterval(()=>{if(view==='examplay'){if(Date.now()>=exam.ends)finishExam();else{let el=$('#clock');if(el)el.textContent=clock()}}},1000);render()}
function clock(){let t=Math.max(0,Math.ceil((exam.ends-Date.now())/1000));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function examUI(){if(!exam)return go('exam');let i=exam.index,q=exam.qs[i],ans=exam.answers[i]||[];frame(`<div class="rowline"><span class="pill">問 ${i+1}/65</span><span class="gold" id="clock">⏳ ${clock()}</span><button class="btn alt" style="padding:8px;min-height:35px" onclick="if(confirm('採点しますか？'))finishExam()">採点</button></div><div class="meter"><i style="width:${(i+1)/65*100}%"></i></div><div class="panel"><span class="pill">${q.correct.length===2?'2つ選択':'1つ選択'} · ${q.tag}</span><h2 style="font-size:18px;line-height:1.6;margin:18px 0">${esc(q.q)}</h2>${q.order.map((o,n)=>`<button class="choice ${ans.includes(n)?'selected':''}" onclick="examPick(${n})">${ans.includes(n)?'☑':'□'} ${'ABCD'[n]}　${esc(o.t)}</button>`).join('')}</div><div class="btnrow"><button class="btn alt" onclick="examMove(-1)" ${i===0?'disabled':''}>← 前へ</button><button class="btn" onclick="${i===64?'finishExam()':'examMove(1)'}">${i===64?'採点する':'次へ →'}</button></div><p class="tiny muted" style="text-align:center;margin-top:12px">未回答 ${65-Object.keys(exam.answers).filter(i=>exam.answers[i]?.length===exam.qs[i].correct.length).length}問</p>`)}
function examPick(n){let q=exam.qs[exam.index],a=[...(exam.answers[exam.index]||[])];if(q.correct.length===1)a=[n];else if(a.includes(n))a=a.filter(x=>x!==n);else if(a.length<q.correct.length)a.push(n);exam.answers[exam.index]=a;examUI()}
function examMove(n){exam.index=Math.max(0,Math.min(64,exam.index+n));examUI()}
function finishExam(){if(!exam||exam.submitted)return;exam.submitted=true;clearInterval(mockTimer);exam.results=exam.qs.map((q,i)=>{let a=exam.answers[i]||[];return a.length===q.correctPositions.length&&a.every(v=>q.correctPositions.includes(v))});exam.results.forEach((ok,i)=>track(exam.qs[i],ok));view='examresult';render()}
function examResult(){let correct=exam.results.filter(Boolean).length;let rate=Math.round(correct/65*100);frame(`<div class="panel" style="text-align:center"><div class="reward">${rate>=70?'🏆':'📜'}</div><h2>模擬試験の結果</h2><h1 style="font-size:47px;color:var(--gold);margin:15px">${correct} / 65</h1><p>正答率 ${rate}%</p><div class="notice">正答率で評価しています。公式の700点スケールへの換算ではありません。</div><button class="btn wide" onclick="exam=null;go('exam')">模試メニューに戻る</button></div><div class="panel"><h2>分野別分析</h2>${REGIONS.map((r,d)=>{let arr=exam.qs.map((q,i)=>({q,ok:exam.results[i]})).filter(x=>x.q.d===d);return `<div class="rowline small"><span>${r.icon} ${r.name}</span><b>${arr.filter(x=>x.ok).length}/${arr.length}</b></div>`}).join('')}</div><div class="panel"><h2>全問の解説</h2>${exam.qs.map((q,i)=>`<details class="item"><summary class="small" style="color:${exam.results[i]?'#6be0c1':'#ff9aa9'}">${exam.results[i]?'✅':'❌'} 問${i+1}: ${esc(q.q)}</summary><p class="small" style="margin-top:10px;line-height:1.7">正解：${q.correctPositions.map(n=>esc(q.order[n].t)).join(' / ')}<br>${esc(q.ex)}<br>その他の選択肢は、必要な機能や条件が異なります。</p></details>`).join('')}</div>`)}
window.addEventListener('pagehide',()=>{if(view==='battle'&&battle)S.studySeconds+=Math.max(0,Math.round((Date.now()-battle.start)/1000));save()});daily();render();
</script></body></html>
